name: Build experimental Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/session-stability

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and pinned NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;17.2.4988734"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK for hardware testing
        uses: actions/upload-artifact@v4
        with:
          name: OpenDroidAuto-Honda-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
